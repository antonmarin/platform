---
version: '3.9'

services:
  3x-ui:
    # https://github.com/MHSanaei/3x-ui/wiki/Installation
    image: bigbugcc/3x-ui:v3.2.8
    container_name: 3x-ui
    restart: unless-stopped
    # admin:admin by defaul
    # https://github.com/MHSanaei/3x-ui/wiki/Configuration
    environment:
      TZ: "Etc/UTC"
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_DB_FOLDER: "/etc/x-ui"
      ACME_HOSTNAME:
    labels:
      - sh.acme.autoload.domain=${ACME_HOSTNAME}
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - db:/etc/x-ui
      - cert:/root/cert
    ports:
      - "2053:2053"      # Web UI HTTPS
      - "2096:2096"      # subscription
      - "443:443"        # Xray tcp
      - "8443:8443/udp"      # Xray udp
#      - "80:80"          # HTTP fallback/Xray
    # Additional inbound ports (add as needed)
    # - "1080:1080"      # SOCKS proxy
    # - "8080:8080"      # HTTP proxy
    # config in /app/bin/config.json

  renew:
    image: ghcr.io/acmesh-official/acme.sh
    container_name: "3x-ui-ssl-renew"
    restart: unless-stopped
    environment:
      TZ: "Etc/UTC"
      ACME_HOSTNAME:
      DEPLOY_DOCKER_CONTAINER_LABEL: "sh.acme.autoload.domain=${ACME_HOSTNAME}"
      DEPLOY_DOCKER_CONTAINER_KEY_FILE: "/root/cert/${ACME_HOSTNAME}/key.pem"
      DEPLOY_DOCKER_CONTAINER_CERT_FILE: "/root/cert/${ACME_HOSTNAME}/cert.pem"
      DEPLOY_DOCKER_CONTAINER_CA_FILE: "/root/cert/${ACME_HOSTNAME}/ca.pem"
      DEPLOY_DOCKER_CONTAINER_FULLCHAIN_FILE: "/root/cert/${ACME_HOSTNAME}/full.pem"
      DEPLOY_DOCKER_CONTAINER_RELOAD_CMD: "x-ui restart"
    volumes:
      - acme:/acme.sh
#      - cert:/root/cert
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "80:80"      # acme http port
    command: [ "daemon" ]
#    command: [ "--issue","-d","${ACME_HOSTNAME}", "--standalone","--debug" ]
#    acme.sh --register-account -m my@$ACME_HOSTNAME (from not restricted location)
#    acme.sh --set-default-ca --server letsencrypt
#    acme.sh --issue -d $ACME_HOSTNAME --standalone
#    acme.sh --renew -d $ACME_HOSTNAME --force
#/root/.acme.sh/ rrqzexxTRLcQlPOLBsWl1fTwInue1jI0k1E4U2V5F0
volumes:
  db:
  cert:
  acme:

